<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>AppInApp – Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --primary:#65A694;--primary-dark:#47766C;--primary-light:#CCE0DC;
      --bg:#F2F7F6;--surface:#fff;--border:#E6F0EE;
      --text-900:#0C1312;--text-600:#3D5C57;--text-400:#83B4AA;
      --sidebar-w:248px;--topnav-h:56px;
      --radius-sm:6px;--radius-md:8px;--radius-lg:10px;--radius-xl:14px;
      --shadow-sm:0 1px 3px rgba(0,0,0,.06);--shadow-md:0 4px 12px rgba(0,0,0,.08);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text-900);display:flex;flex-direction:column;height:100vh;overflow:hidden}

    /* ═══ TOPNAV ═══ */
    .topnav{
      height:var(--topnav-h);background:var(--surface);
      border-bottom:1px solid var(--border);
      display:flex;align-items:center;justify-content:space-between;
      padding:0 1rem 0 .875rem;z-index:200;flex-shrink:0;gap:.5rem;
    }
    .topnav-left{display:flex;align-items:center;gap:.625rem;min-width:0;overflow:hidden}

    .brand{display:flex;align-items:center;gap:.4375rem;text-decoration:none;color:inherit;flex-shrink:0}
    .brand-icon{width:30px;height:30px;background:var(--primary);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center}
    .brand-icon svg{color:#fff}
    .brand-name{font-size:1rem;font-weight:700;letter-spacing:-.02em}
    .brand-name em{font-style:normal;color:var(--primary)}

    .divider-v{width:1px;height:20px;background:var(--border);flex-shrink:0}

    /* biz label in topnav */
    .biz-topnav-label{
      display:flex;align-items:center;gap:.375rem;
      padding:.25rem .625rem .25rem .4375rem;border-radius:99px;
      background:var(--bg);border:1.5px solid var(--border);
      font-size:.8125rem;font-weight:600;white-space:nowrap;flex-shrink:0;
      cursor:pointer;transition:border-color .15s;
    }
    .biz-topnav-label:hover{border-color:var(--primary)}
    .biz-topnav-label .dot{width:7px;height:7px;border-radius:50%}

    /* module pills */
    .module-switcher{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none}
    .module-switcher::-webkit-scrollbar{display:none}
    .mod-pill{
      display:flex;align-items:center;gap:.375rem;padding:.25rem .65rem;
      border-radius:99px;border:none;background:transparent;
      font-family:'Inter',sans-serif;font-size:.8rem;font-weight:500;
      color:var(--text-600);cursor:pointer;white-space:nowrap;
      transition:background .15s,color .15s;
    }
    .mod-pill:hover{background:var(--bg);color:var(--text-900)}
    .mod-pill.active{background:var(--primary-light);color:var(--primary-dark);font-weight:600}
    .mod-pill-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.4}
    .mod-pill.active .mod-pill-dot{opacity:1}

    /* all-apps launcher btn */
    .launcher-btn{
      display:flex;align-items:center;gap:.375rem;padding:.25rem .625rem;
      border-radius:99px;border:1.5px solid var(--border);background:transparent;
      font-family:'Inter',sans-serif;font-size:.8rem;font-weight:500;
      color:var(--text-600);cursor:pointer;white-space:nowrap;flex-shrink:0;
      transition:border-color .15s,color .15s;
    }
    .launcher-btn:hover{border-color:var(--primary);color:var(--primary)}

    .topnav-right{display:flex;align-items:center;gap:.375rem;flex-shrink:0}
    .icon-btn{width:32px;height:32px;border-radius:var(--radius-md);border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-600);transition:background .15s}
    .icon-btn:hover{background:var(--bg)}
    .badge-wrap{position:relative}
    .badge{position:absolute;top:-2px;right:-2px;width:14px;height:14px;background:#E8503D;border-radius:50%;border:2px solid var(--surface);display:flex;align-items:center;justify-content:center;font-size:7px;color:#fff;font-weight:700}
    .avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:600;cursor:pointer}

    /* ═══ BODY ═══ */
    .body-wrap{display:flex;flex:1;overflow:hidden}

    /* ─── SIDEBAR ─── */
    .sidebar{
      width:var(--sidebar-w);background:var(--surface);
      border-right:1px solid var(--border);display:flex;flex-direction:column;
      flex-shrink:0;overflow-y:auto;scrollbar-width:thin;
      scrollbar-color:var(--border) transparent;position:relative;
    }
    .sidebar::-webkit-scrollbar{width:4px}
    .sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}

    /* Context switcher */
    .ctx-switcher{
      border-bottom:1px solid var(--border);padding:.75rem;
      background:var(--bg);position:relative;
    }
    .ctx-row-block{display:flex;flex-direction:column;gap:.375rem}
    .ctx-select-btn{
      display:flex;align-items:center;gap:.5rem;
      padding:.4375rem .625rem;border-radius:var(--radius-md);
      background:var(--surface);border:1.5px solid var(--border);
      cursor:pointer;transition:border-color .15s;width:100%;text-align:left;
      font-family:'Inter',sans-serif;
    }
    .ctx-select-btn:hover{border-color:var(--primary)}
    .ctx-select-icon{width:20px;height:20px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .ctx-select-label{flex:1;min-width:0}
    .ctx-select-label-meta{font-size:.6875rem;color:var(--text-400);line-height:1}
    .ctx-select-label-val{font-size:.8125rem;font-weight:600;color:var(--text-900);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ctx-chevron{color:var(--text-400);flex-shrink:0;transition:transform .2s}
    .ctx-select-btn.open .ctx-chevron{transform:rotate(180deg)}

    /* dropdown from ctx */
    .ctx-dropdown{
      position:absolute;left:.75rem;right:.75rem;z-index:100;
      background:var(--surface);border:1.5px solid var(--border);
      border-radius:var(--radius-lg);box-shadow:var(--shadow-md);
      overflow:hidden;display:none;
    }
    .ctx-dropdown.open{display:block}
    .ctx-dropdown-item{
      display:flex;align-items:center;gap:.5rem;padding:.5625rem .75rem;
      font-size:.8125rem;cursor:pointer;transition:background .12s;
    }
    .ctx-dropdown-item:hover{background:var(--bg)}
    .ctx-dropdown-item.active{color:var(--primary-dark);background:var(--primary-light)}
    .ctx-dropdown-item .check{width:14px;height:14px;margin-left:auto;color:var(--primary);visibility:hidden}
    .ctx-dropdown-item.active .check{visibility:visible}
    .ctx-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

    /* sidebar app header */
    .sidebar-header{padding:.875rem 1rem .5rem;display:flex;align-items:center;gap:.5rem}
    .sidebar-app-icon{width:28px;height:28px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .sidebar-app-icon svg{width:14px;height:14px;color:#fff}
    .sidebar-app-name{font-size:.9375rem;font-weight:700;letter-spacing:-.01em}

    .sidebar-section{padding:.5rem 1rem .25rem;font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text-400)}
    .sidebar-divider{height:1px;background:var(--border);margin:.375rem .875rem}

    .nav-item{
      display:flex;align-items:center;gap:.5625rem;padding:.45rem .875rem;
      border-radius:var(--radius-md);text-decoration:none;color:var(--text-600);
      font-size:.875rem;font-weight:500;cursor:pointer;
      transition:background .12s,color .12s;margin:1px .5rem;
    }
    .nav-item:hover{background:var(--bg);color:var(--text-900)}
    .nav-item.active{background:var(--primary-light);color:var(--primary-dark)}
    .nav-item.active svg{color:var(--primary)}
    .nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.7}
    .nav-item.active svg{opacity:1}
    .nav-badge{margin-left:auto;background:#E8503D;color:#fff;font-size:.6875rem;font-weight:700;padding:.125rem .375rem;border-radius:99px}

    .nav-parent{display:flex;align-items:center;gap:.5625rem;padding:.45rem .875rem;border-radius:var(--radius-md);text-decoration:none;color:var(--text-600);font-size:.875rem;font-weight:500;cursor:pointer;transition:background .12s,color .12s;margin:1px .5rem;justify-content:space-between}
    .nav-parent:hover{background:var(--bg);color:var(--text-900)}
    .nav-parent-left{display:flex;align-items:center;gap:.5625rem}
    .nav-parent svg.icon{width:16px;height:16px;opacity:.7}
    .nav-parent svg.chevron{width:12px;height:12px;transition:transform .2s;opacity:.5}
    .nav-parent.open svg.chevron{transform:rotate(90deg)}
    .nav-children{margin-left:2.25rem;overflow:hidden;max-height:0;transition:max-height .25s ease}
    .nav-children.open{max-height:300px}
    .nav-child{display:flex;align-items:center;gap:.4375rem;padding:.3125rem .5rem;border-radius:var(--radius-md);text-decoration:none;color:var(--text-600);font-size:.8125rem;cursor:pointer;transition:background .12s,color .12s;margin:1px .25rem}
    .nav-child:hover{background:var(--bg);color:var(--text-900)}
    .nav-child.active{color:var(--primary-dark);font-weight:600}

    .sidebar-footer{margin-top:auto;border-top:1px solid var(--border);padding:.625rem}
    .sidebar-footer-item{display:flex;align-items:center;gap:.5625rem;padding:.4rem .5rem;border-radius:var(--radius-md);color:var(--text-600);font-size:.8125rem;cursor:pointer;transition:background .12s;text-decoration:none}
    .sidebar-footer-item:hover{background:var(--bg);color:var(--text-900)}
    .sidebar-footer-item svg{width:15px;height:15px;flex-shrink:0}

    /* ─── CONTENT ─── */
    .content{flex:1;overflow-y:auto;display:flex;flex-direction:column}

    .page-header{
      background:var(--surface);border-bottom:1px solid var(--border);
      padding:.875rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-shrink:0;
    }
    .page-title{font-size:1.0625rem;font-weight:700;letter-spacing:-.02em}
    .page-breadcrumb{font-size:.75rem;color:var(--text-600);display:flex;align-items:center;gap:.3125rem;margin-top:.125rem;flex-wrap:wrap}
    .bc-sep{opacity:.4}
    .page-actions{display:flex;align-items:center;gap:.4375rem}
    .btn{display:flex;align-items:center;gap:.375rem;padding:.4375rem .875rem;border-radius:var(--radius-md);font-family:'Inter',sans-serif;font-size:.875rem;font-weight:500;cursor:pointer;border:none;transition:background .15s}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-primary:hover{background:var(--primary-dark)}
    .btn-secondary{background:var(--bg);color:var(--text-600);border:1.5px solid var(--border)}
    .btn-secondary:hover{border-color:var(--primary);color:var(--primary)}
    .btn svg{width:14px;height:14px}

    .tab-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;align-items:flex-end;flex-shrink:0}
    .tab{padding:.625rem .75rem;font-size:.875rem;font-weight:500;color:var(--text-600);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;white-space:nowrap}
    .tab:hover{color:var(--text-900)}
    .tab.active{color:var(--primary-dark);border-bottom-color:var(--primary)}
    .tab-count{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;background:var(--primary);color:#fff;border-radius:99px;font-size:.6875rem;font-weight:700;margin-left:.3125rem}
    .tab-count-red{background:#E8503D}

    .content-inner{padding:1.25rem 1.5rem;flex:1}

    /* Stats */
    .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1rem}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:.875rem 1rem}
    .stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.375rem}
    .stat-label{font-size:.6875rem;font-weight:600;color:var(--text-600);text-transform:uppercase;letter-spacing:.06em}
    .stat-icon-wrap{width:28px;height:28px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center}
    .stat-icon-wrap svg{width:14px;height:14px}
    .stat-value{font-size:1.3125rem;font-weight:700;letter-spacing:-.03em}
    .stat-sub{font-size:.75rem;color:var(--text-600);margin-top:.125rem}
    .up{color:#10B981}.down{color:#E8503D}

    /* Table */
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
    .card-header{padding:.75rem 1.125rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .card-title{font-size:.9375rem;font-weight:600}
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:.875rem}
    thead th{text-align:left;padding:.5625rem .875rem;font-size:.6875rem;font-weight:600;color:var(--text-600);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border)}
    tbody tr{border-bottom:1px solid var(--border);transition:background .1s;cursor:pointer}
    tbody tr:last-child{border-bottom:none}
    tbody tr:hover{background:var(--bg)}
    td{padding:.625rem .875rem;vertical-align:middle}
    .order-id{font-weight:600;color:var(--primary-dark)}
    .chip{display:inline-flex;align-items:center;padding:.1875rem .5rem;border-radius:99px;font-size:.75rem;font-weight:600}
    .chip-green{background:#d1fae5;color:#047857}
    .chip-yellow{background:#fef3c7;color:#d97706}
    .chip-blue{background:#dbeafe;color:#1d4ed8}
    .chip-red{background:#fee2e2;color:#b91c1c}
    .chip-gray{background:#f3f4f6;color:#374151}
  </style>
</head>
<body>

<!-- ═══ TOPNAV ═══ -->
<header class="topnav">
  <div class="topnav-left">
    <a href="launcher.html" class="brand" title="Back to launcher">
      <div class="brand-icon">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/></svg>
      </div>
      <span class="brand-name">App<em>In</em>App</span>
    </a>

    <div class="divider-v"></div>

    <!-- Active business label -->
    <div class="biz-topnav-label" id="bizTopLabel" onclick="goLauncher()">
      <span class="dot" id="bizDot" style="background:var(--primary)"></span>
      <span id="bizTopName">Kilimani Grill</span>
      <svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>

    <div class="divider-v"></div>

    </nav>

    <div class="divider-v"></div>

    <button class="launcher-btn" onclick="goLauncher()">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/></svg>
      All Businesses
    </button>
  </div>

  <div class="topnav-right">
    <button class="icon-btn" title="Global search">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
    </button>
    <div class="badge-wrap">
      <button class="icon-btn" title="Notifications">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/></svg>
      </button>
      <div class="badge">3</div>
    </div>
    <div class="divider-v"></div>
    <div class="avatar">JO</div>
  </div>
</header>

<!-- ═══ BODY ═══ -->
<div class="body-wrap">

  <!-- ─── SIDEBAR ─── -->
  <aside class="sidebar" id="sidebar">
    <!-- Context switcher (static in HTML, JS enhances) -->
    <div class="ctx-switcher" id="ctxSwitcher">
      <!-- filled by JS -->
    </div>

    <!-- Module nav header and items -->
    <div id="sidebarNav">
      <!-- filled by JS -->
    </div>
  </aside>

  <!-- ─── CONTENT ─── -->
  <div class="content" id="mainContent">
    <!-- filled by JS -->
  </div>

</div>

<script>

   Business + module definitions
════════════════════════════════════════════ */

════════════════════════════════════════════ */

        </div>

          <div class="ctx-select-label-meta">Business</div>
          <div class="ctx-select-label-val">${biz.name}</div>
        </div>
        <svg class="ctx-chevron" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" width="12" height="12"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>
      </button>
      <div class="ctx-dropdown" id="biz-drop" style="top:auto;margin-top:2px">${bizOptionsHtml}</div>

      <!-- Branch selector -->
      <button class="ctx-select-btn" id="branchSelBtn" onclick="toggleDrop('branch-drop')">

          <svg fill="none" stroke="#10b981" stroke-width="2" viewBox="0 0 24 24" width="12" height="12"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"/></svg>
        </div>
        <div class="ctx-select-label">
          <div class="ctx-select-label-meta">Branch</div>
          <div class="ctx-select-label-val">${currentBranch}</div>
        </div>
        <svg class="ctx-chevron" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" width="12" height="12"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>

function toggleDrop(id){
  const drop = document.getElementById(id);
  const isOpen = drop.classList.contains('open');
  // Close all
  document.querySelectorAll('.ctx-dropdown').forEach(d=>d.classList.remove('open'));
  document.querySelectorAll('.ctx-select-btn').forEach(b=>b.classList.remove('open'));
  if(!isOpen){
    drop.classList.add('open');
    drop.previousElementSibling.classList.add('open');
  }
}

// Close dropdowns on outside click
document.addEventListener('click', ()=>{
  document.querySelectorAll('.ctx-dropdown').forEach(d=>d.classList.remove('open'));
  document.querySelectorAll('.ctx-select-btn').forEach(b=>b.classList.remove('open'));
});

/* ════════════════════════════════════════════
   Build module pills in topnav
════════════════════════════════════════════ */
function buildModulePills(){
  const biz = businesses[currentBiz];
  const sw = document.getElementById('moduleSwitcher');
  sw.innerHTML = biz.modules.map(m=>{
    const app = apps[m];
    if(!app) return '';
    return `<button class="mod-pill ${m===currentModule?'active':''}" data-mod="${m}" onclick="switchModule('${m}')">
      <span class="mod-pill-dot"></span>${app.label}
    </button>`;
  }).join('');
}

  const app = apps[currentModule];

/* ════════════════════════════════════════════
   Interactions
════════════════════════════════════════════ */
function toggleNav(el){
  el.classList.toggle('open');
  el.nextElementSibling.classList.toggle('open');
}

function setActive(navId){
  activeNavId=navId;
  buildSidebarNav();
  buildContent();
}

function switchModule(mod){
  currentModule=mod;
  activeNavId=apps[mod]?.nav?.find(n=>n.id)?.id||'dashboard';
  buildModulePills();
  buildSidebarNav();
  buildContent();
}

function switchBiz(bizKey){
  currentBiz=bizKey;
  currentBranch=businesses[bizKey].branches[0];
  currentModule=businesses[bizKey].modules[0];
  activeNavId=apps[currentModule]?.nav?.find(n=>n.id)?.id||'dashboard';
  buildContextSwitcher();
  buildModulePills();
  buildSidebarNav();
  buildContent();
}

function switchBranch(branch){
  currentBranch=branch;
  buildContextSwitcher();
  buildContent();
}

function goLauncher(){
  window.location.href='launcher.html';
}

/* ════════════════════════════════════════════
   Init from sessionStorage or defaults
════════════════════════════════════════════ */
const storedMod = sessionStorage.getItem('activeApp');
const storedBiz = sessionStorage.getItem('activeBiz');
const storedBranch = sessionStorage.getItem('activeBranch');
if(storedBiz && businesses[storedBiz]) {
  currentBiz=storedBiz;
  currentBranch=businesses[storedBiz].branches[0];
}
if(storedBranch) currentBranch=storedBranch;
if(storedMod && apps[storedMod]) {
  currentModule=storedMod;
  activeNavId=apps[storedMod].nav.find(n=>n.id)?.id||'dashboard';
} else {
  currentModule=businesses[currentBiz].modules[0];
  activeNavId=apps[currentModule]?.nav?.find(n=>n.id)?.id||'dashboard';
}

buildContextSwitcher();
buildModulePills();
buildSidebarNav();
buildContent();
</script>
