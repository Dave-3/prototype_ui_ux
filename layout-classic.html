<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>AppInApp – Layout B · Icon Rail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --primary:#65A694;--primary-dark:#47766C;--primary-light:#CCE0DC;
      --bg:#F2F7F6;--surface:#ffffff;--border:#E6F0EE;
      --text-900:#0C1312;--text-600:#3D5C57;--text-400:#83B4AA;
      --rail-w:64px;--panel-w:220px;
      --topbar-h:56px;
      --radius-sm:6px;--radius-md:8px;--radius-lg:10px;
      --shadow-sm:0 1px 3px rgba(0,0,0,.06);
      --shadow-md:0 4px 12px rgba(0,0,0,.08);
      --shadow-lg:0 8px 24px rgba(0,0,0,.12);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text-900);display:flex;height:100vh;overflow:hidden}

    /* ════════════════════════════════
       ICON RAIL (leftmost column)
    ════════════════════════════════ */
    .rail{
      width:var(--rail-w);background:var(--text-900);
      display:flex;flex-direction:column;align-items:center;
      padding:.75rem 0;gap:.25rem;z-index:300;flex-shrink:0;
      overflow:visible;
    }

    .rail-brand{
      width:38px;height:38px;background:var(--primary);border-radius:var(--radius-md);
      display:flex;align-items:center;justify-content:center;
      margin-bottom:.5rem;cursor:pointer;flex-shrink:0;
    }
    .rail-brand svg{color:#fff}

    .rail-divider{width:32px;height:1px;background:rgba(255,255,255,.1);margin:.25rem 0}

    /* rail app button */
    .rail-item{
      position:relative;width:44px;height:44px;border-radius:var(--radius-md);
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;transition:background .15s;
      color:rgba(255,255,255,.55);
      flex-shrink:0;
    }
    .rail-item:hover{background:rgba(255,255,255,.1);color:rgba(255,255,255,.9)}
    .rail-item.active{background:rgba(101,166,148,.25);color:var(--primary-light)}
    .rail-item svg{width:20px;height:20px}

    /* badge on rail */
    .rail-badge{
      position:absolute;top:4px;right:4px;min-width:14px;height:14px;
      background:#E8503D;border-radius:99px;border:2px solid var(--text-900);
      display:flex;align-items:center;justify-content:center;
      font-size:8px;color:#fff;font-weight:700;padding:0 2px;
    }

    /* tooltip on hover */
    .rail-tooltip{
      position:absolute;left:calc(var(--rail-w) + 6px);top:50%;transform:translateY(-50%);
      background:var(--text-900);color:#fff;font-size:.75rem;font-weight:500;
      padding:.3125rem .625rem;border-radius:var(--radius-sm);
      white-space:nowrap;pointer-events:none;opacity:0;z-index:400;
      box-shadow:var(--shadow-md);
      transition:opacity .1s .05s;
    }
    .rail-item:hover .rail-tooltip{opacity:1}

    /* rail bottom */
    .rail-spacer{flex:1}
    .rail-avatar{
      width:32px;height:32px;border-radius:50%;background:var(--primary);
      color:#fff;display:flex;align-items:center;justify-content:center;
      font-size:.6875rem;font-weight:600;cursor:pointer;margin-top:.25rem;
    }

    /* ════════════════════════════════
       CONTEXTUAL FLYOUT PANEL
    ════════════════════════════════ */
    .panel-wrap{
      position:relative;z-index:200;
      width:0;overflow:hidden;
      transition:width .25s cubic-bezier(.4,0,.2,1);
      flex-shrink:0;
    }
    .panel-wrap.open{width:var(--panel-w)}

    .panel{
      width:var(--panel-w);height:100vh;background:var(--surface);
      border-right:1px solid var(--border);
      display:flex;flex-direction:column;overflow-y:auto;
      scrollbar-width:thin;scrollbar-color:var(--border) transparent;
    }
    .panel::-webkit-scrollbar{width:4px}
    .panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}

    .panel-header{
      padding:.875rem 1rem .625rem;
      border-bottom:1px solid var(--border);
      flex-shrink:0;
    }
    .panel-app-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.375rem}
    .panel-app-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
    .panel-app-name{font-size:.9375rem;font-weight:700;letter-spacing:-.01em}
    .panel-branch{font-size:.75rem;color:var(--text-600)}

    .panel-section{padding:.5rem 1rem .2rem;font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text-400)}

    .panel-item{
      display:flex;align-items:center;justify-content:space-between;
      padding:.4375rem .875rem;border-radius:var(--radius-md);
      text-decoration:none;color:var(--text-600);font-size:.875rem;font-weight:500;
      cursor:pointer;transition:background .1s,color .1s;margin:1px .5rem;
    }
    .panel-item-left{display:flex;align-items:center;gap:.5rem}
    .panel-item-left svg{width:15px;height:15px;opacity:.7;flex-shrink:0}
    .panel-item:hover{background:var(--bg);color:var(--text-900)}
    .panel-item.active{background:var(--primary-light);color:var(--primary-dark)}
    .panel-item.active svg{opacity:1;color:var(--primary)}
    .item-badge{background:#E8503D;color:#fff;font-size:.625rem;font-weight:700;padding:.125rem .375rem;border-radius:99px}

    /* panel nested */
    .panel-parent{display:flex;align-items:center;justify-content:space-between;padding:.4375rem .875rem;border-radius:var(--radius-md);color:var(--text-600);font-size:.875rem;font-weight:500;cursor:pointer;margin:1px .5rem;transition:background .1s}
    .panel-parent:hover{background:var(--bg);color:var(--text-900)}
    .panel-parent-left{display:flex;align-items:center;gap:.5rem}
    .panel-parent-left svg{width:15px;height:15px;opacity:.7}
    .pchevron{width:12px;height:12px;transition:transform .2s;opacity:.5}
    .panel-parent.open .pchevron{transform:rotate(90deg)}
    .panel-children{margin-left:1.875rem;max-height:0;overflow:hidden;transition:max-height .25s}
    .panel-children.open{max-height:300px}
    .panel-child{padding:.3125rem .5rem;border-radius:var(--radius-sm);font-size:.8125rem;color:var(--text-600);cursor:pointer;transition:background .1s,color .1s;margin:1px .25rem}
    .panel-child:hover{background:var(--bg);color:var(--text-900)}
    .panel-child.active{color:var(--primary-dark);font-weight:600}

    .panel-divider{height:1px;background:var(--border);margin:.375rem .875rem}

    .panel-footer{margin-top:auto;border-top:1px solid var(--border);padding:.625rem .75rem}
    .panel-foot-item{display:flex;align-items:center;gap:.5rem;padding:.375rem .5rem;border-radius:var(--radius-sm);color:var(--text-600);font-size:.8125rem;cursor:pointer;transition:background .1s}
    .panel-foot-item:hover{background:var(--bg);color:var(--text-900)}
    .panel-foot-item svg{width:14px;height:14px}

    /* ════════════════════════════════
       MAIN AREA (topbar + content)
    ════════════════════════════════ */
    .main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

    .topbar{
      height:var(--topbar-h);background:var(--surface);
      border-bottom:1px solid var(--border);
      display:flex;align-items:center;justify-content:space-between;
      padding:0 1.25rem;z-index:100;flex-shrink:0;gap:1rem;
    }
    .topbar-left{display:flex;align-items:center;gap:.75rem;min-width:0;overflow:hidden}

    /* breadcrumb */
    .breadcrumb{display:flex;align-items:center;gap:.375rem;font-size:.875rem;min-width:0;overflow:hidden}
    .breadcrumb-seg{color:var(--text-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .breadcrumb-seg.active{color:var(--text-900);font-weight:600}
    .bc-sep{opacity:.3;flex-shrink:0}

    .divider-v{width:1px;height:20px;background:var(--border);flex-shrink:0}

    .topbar-right{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
    .icon-btn{width:32px;height:32px;border-radius:var(--radius-md);border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-600);transition:background .15s}
    .icon-btn:hover{background:var(--bg)}
    .badge-wrap{position:relative}
    .badge{position:absolute;top:-2px;right:-2px;width:14px;height:14px;background:#E8503D;border-radius:50%;border:2px solid var(--surface);display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff;font-weight:700}

    /* layout toggle */
    .layout-toggle{display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:3px;gap:2px}
    .layout-btn{display:flex;align-items:center;gap:.35rem;padding:.25rem .625rem;border-radius:99px;border:none;background:transparent;font-family:'Inter',sans-serif;font-size:.75rem;font-weight:500;color:var(--text-600);cursor:pointer;transition:background .15s,color .15s}
    .layout-btn.active{background:var(--surface);color:var(--primary-dark);box-shadow:var(--shadow-sm)}

    .ctx-chip{display:flex;align-items:center;gap:.375rem;font-size:.75rem;color:var(--text-600);padding:.25rem .5rem;border-radius:var(--radius-sm);cursor:pointer;transition:background .15s;background:transparent;border:none;font-family:'Inter',sans-serif;white-space:nowrap}
    .ctx-chip:hover{background:var(--bg)}
    .ctx-dot{width:7px;height:7px;border-radius:50%;background:var(--primary);flex-shrink:0}

    /* content */
    .content{flex:1;overflow-y:auto;display:flex;flex-direction:column}
    .page-header{background:var(--surface);border-bottom:1px solid var(--border);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-shrink:0}
    .page-title{font-size:1.125rem;font-weight:700;letter-spacing:-.02em}
    .page-sub{font-size:.8125rem;color:var(--text-600);margin-top:.125rem}
    .page-actions{display:flex;align-items:center;gap:.5rem}
    .btn{display:flex;align-items:center;gap:.4375rem;padding:.4375rem .875rem;border-radius:var(--radius-md);font-family:'Inter',sans-serif;font-size:.875rem;font-weight:500;cursor:pointer;border:none;transition:background .15s}
    .btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
    .btn-secondary{background:var(--bg);color:var(--text-600);border:1.5px solid var(--border)}.btn-secondary:hover{border-color:var(--primary);color:var(--primary)}
    .btn svg{width:14px;height:14px}
    .tab-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;align-items:flex-end;gap:0;flex-shrink:0}
    .tab{padding:.625rem .8125rem;font-size:.875rem;font-weight:500;color:var(--text-600);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s}
    .tab:hover{color:var(--text-900)}
    .tab.active{color:var(--primary-dark);border-bottom-color:var(--primary)}
    .tab-count{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;background:var(--primary);color:#fff;border-radius:50%;font-size:.6875rem;font-weight:700;margin-left:.4375rem}
    .content-inner{padding:1.5rem;flex:1}
    .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:.875rem;margin-bottom:1.25rem}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.125rem}
    .stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem}
    .stat-label{font-size:.6875rem;font-weight:600;color:var(--text-600);text-transform:uppercase;letter-spacing:.06em}
    .stat-icon-wrap{width:28px;height:28px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center}
    .stat-icon-wrap svg{width:14px;height:14px}
    .stat-value{font-size:1.375rem;font-weight:700;letter-spacing:-.03em}
    .stat-sub{font-size:.75rem;color:var(--text-600);margin-top:.25rem}
    .up{color:#10B981}.down{color:#E8503D}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
    .card-header{padding:.875rem 1.125rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .card-title{font-size:.9375rem;font-weight:600}
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:.875rem}
    thead th{text-align:left;padding:.5625rem .875rem;font-size:.6875rem;font-weight:600;color:var(--text-600);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border)}
    tbody tr{border-bottom:1px solid var(--border);transition:background .1s;cursor:pointer}
    tbody tr:last-child{border-bottom:none}
    tbody tr:hover{background:var(--bg)}
    td{padding:.625rem .875rem;vertical-align:middle}
    .order-id{font-weight:600;color:var(--primary-dark)}
    .chip{display:inline-flex;align-items:center;padding:.1875rem .5rem;border-radius:99px;font-size:.6875rem;font-weight:600}
    .chip-green{background:#d1fae5;color:#047857}.chip-yellow{background:#fef3c7;color:#d97706}.chip-blue{background:#dbeafe;color:#1d4ed8}.chip-red{background:#fee2e2;color:#b91c1c}.chip-gray{background:#f3f4f6;color:#374151}
  </style>
</head>
<body>

<!-- ════════════════════ ICON RAIL ════════════════════ -->
<nav class="rail" id="rail">
  <!-- Brand -->
  <div class="rail-brand" onclick="window.location.href='launcher.html'" title="Back to launcher">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/></svg>
  </div>

  <div class="rail-divider"></div>

  <!-- App items — built by JS -->
  <div id="railItems" style="display:contents"></div>

  <div class="rail-spacer"></div>
  <div class="rail-divider"></div>

  <!-- Settings -->
  <div class="rail-item" onclick="openPanel('settings')" id="rail-settings">
    <svg fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.343 3.94c.09-.542.56-.94 1.11-.94h1.093c.55 0 1.02.398 1.11.94l.149.894c.07.424.384.764.78.93.398.164.855.142 1.205-.108l.737-.527a1.125 1.125 0 011.45.12l.773.774c.39.389.44 1.002.12 1.45l-.527.737c-.25.35-.272.806-.107 1.204.165.397.505.71.93.78l.893.15c.543.09.94.56.94 1.109v1.094c0 .55-.397 1.02-.94 1.11l-.893.149c-.425.07-.765.383-.93.78-.165.398-.143.854.107 1.204l.527.738c.32.447.269 1.06-.12 1.45l-.774.773a1.125 1.125 0 01-1.449.12l-.738-.527c-.35-.25-.806-.272-1.203-.107-.397.165-.71.505-.781.929l-.149.894c-.09.542-.56.94-1.11.94h-1.094c-.55 0-1.019-.398-1.11-.94l-.148-.894c-.071-.424-.384-.764-.781-.93-.398-.164-.854-.142-1.204.108l-.738.527c-.447.32-1.06.269-1.45-.12l-.773-.774a1.125 1.125 0 01-.12-1.45l.527-.737c.25-.35.273-.806.108-1.204-.165-.397-.505-.71-.93-.78l-.894-.15c-.542-.09-.94-.56-.94-1.109v-1.094c0-.55.398-1.02.94-1.11l.894-.149c.424-.07.765-.383.93-.78.165-.398.143-.854-.107-1.204l-.527-.738a1.125 1.125 0 01.12-1.45l.773-.773a1.125 1.125 0 011.45-.12l.737.527c.35.25.807.272 1.204.107.397-.165.71-.505.78-.929l.15-.894z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
    <div class="rail-tooltip">Settings</div>
  </div>

  <div class="rail-avatar">JA</div>
</nav>

<!-- ════════════════════ PANEL (flyout) ════════════════════ -->
<div class="panel-wrap" id="panelWrap">
  <div class="panel" id="panel">
    <!-- built by JS -->
  </div>
</div>

<!-- ════════════════════ MAIN AREA ════════════════════ -->
<div class="main-area">
  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-left">
      <!-- Breadcrumb -->
      <nav class="breadcrumb" id="breadcrumb">
        <span class="breadcrumb-seg">Kilimani Grill</span>
        <span class="bc-sep">›</span>
        <span class="breadcrumb-seg">Orders</span>
        <span class="bc-sep">›</span>
        <span class="breadcrumb-seg active">Live Orders</span>
      </nav>

      <div class="divider-v"></div>

      <button class="ctx-chip">
        <div class="ctx-dot"></div>
        Main Branch
        <svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>
      </button>
    </div>

    <div class="topbar-right">
      <!-- Search -->
      <button class="icon-btn" title="Search (⌘K)">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
      </button>

      <!-- Layout toggle -->
      <div class="layout-toggle">
        <button class="layout-btn" id="btn-launcher" onclick="gotoLayout('launcher')">
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/></svg>
          A
        </button>
        <button class="layout-btn active" id="btn-classic" onclick="gotoLayout('classic')">
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 5.25h16.5M3.75 12h16.5m-16.5 6.75h16.5"/></svg>
          B
        </button>
      </div>

      <div class="divider-v"></div>

      <div class="badge-wrap">
        <button class="icon-btn">
          <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/></svg>
        </button>
        <div class="badge">3</div>
      </div>
    </div>
  </header>

  <!-- Content -->
  <div class="content" id="mainContent">
    <!-- built by JS -->
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════
   Data (reuse same structure as layout A)
═══════════════════════════════════════════════ */
const apps = {
  orders:{
    name:'Orders',color:'#65A694',badge:'12',
    railIcon:`<svg fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>`,
    nav:[
      {label:'Dashboard',id:'dashboard'},
      {label:'Live Orders',id:'live',badge:'12'},
      {label:'Order History',id:'history'},
      {label:'Temp Orders',id:'temp'},
      {section:'Fulfilment'},
      {label:'Kitchen Queue',id:'kitchen',badge:'4'},
      {label:'Delivery Queue',id:'delivery-q',badge:'6'},
      {label:'Completed',id:'completed'},
    ]
  },

let currentApp='orders';

/* Build rail items */
function buildRail(){
  const ri=document.getElementById('railItems');
  ri.innerHTML=Object.entries(apps).filter(([k])=>k!=='settings').map(([key,app])=>`
    <div class="rail-item ${key===currentApp?'active':''}" id="rail-${key}" onclick="openPanel('${key}')">
      ${app.railIcon}
      ${app.badge?`<div class="rail-badge">${app.badge}</div>`:''}
      <div class="rail-tooltip">${app.name}</div>
    </div>
  `).join('');
}

/* Build panel */
function buildPanel(appKey){
  const app=apps[appKey];
  const panel=document.getElementById('panel');
  let html=`
    <div class="panel-header">
      <div class="panel-app-row">
        <div class="panel-app-dot" style="background:${app.color}"></div>
        <div class="panel-app-name">${app.name}</div>
      </div>
      <div class="panel-branch">Kilimani Grill · Main</div>
    </div>
  `;

  app.nav.forEach(item=>{
    if(item.section){html+=`<div class="panel-section">${item.section}</div>`;return}
    if(item.children){
      const isOpen=item.children.some(c=>c.id===activeNavId)||item.id===activeNavId;
      html+=`
        <div class="panel-parent ${isOpen?'open':''}" onclick="togglePanelNav(this)">
          <div class="panel-parent-left"><svg fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24" width="15" height="15"><path stroke-linecap="round" stroke-linejoin="round" d="M3 6h18M3 12h18M3 18h18"/></svg>${item.label}</div>
          <svg class="pchevron" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
        </div>
        <div class="panel-children ${isOpen?'open':''}">
          ${item.children.map(c=>`<div class="panel-child ${c.id===activeNavId?'active':''}" onclick="setActive('${c.id}')">${c.label}</div>`).join('')}
        </div>`;
    } else {
      html+=`
        <div class="panel-item ${item.id===activeNavId?'active':''}" onclick="setActive('${item.id}')">
          <div class="panel-item-left"><svg fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24" width="15" height="15"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zM3.75 12h.007v.008H3.75V12zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm-.375 5.25h.007v.008H3.75v-.008zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"/></svg>${item.label}</div>
          ${item.badge?`<span class="item-badge">${item.badge}</span>`:''}
        </div>`;
    }
  });

  html+=`
    <div class="panel-footer">
      <div class="panel-foot-item" onclick="window.location.href='launcher.html'">
        <svg fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/></svg>
        All Apps
      </div>
    </div>
  `;

}

/* ── Interactions ── */
function openPanel(appKey){
  if(currentApp===appKey && panelOpen){
    // toggle closed
    panelOpen=false;
    document.getElementById('panelWrap').classList.remove('open');
    document.querySelectorAll('.rail-item').forEach(r=>r.classList.remove('active'));
    return;
  }
  currentApp=appKey;
  panelOpen=true;
  activeNavId=apps[appKey]?.nav.find(n=>n.id)?.id||'dashboard';
  document.getElementById('panelWrap').classList.add('open');
  // update rail active
  document.querySelectorAll('.rail-item').forEach(r=>{
    r.classList.toggle('active',r.id==='rail-'+appKey||r.id==='rail-'+appKey+'-extra');
  });
  document.getElementById('rail-'+appKey)?.classList.add('active');
  buildPanel(appKey);
  buildContent(appKey,activeNavId);
}

function togglePanelNav(el){
  el.classList.toggle('open');
  el.nextElementSibling.classList.toggle('open');
}

function setActive(navId){
  activeNavId=navId;
  buildPanel(currentApp);
  buildContent(currentApp,navId);
}

function gotoLayout(mode){
  if(mode==='launcher') window.location.href='layout-launcher.html';
}

/* Init */
const stored=sessionStorage.getItem('activeApp');
if(stored && apps[stored]) currentApp=stored;
buildRail();
openPanel(currentApp);
