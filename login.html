<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AppInApp – Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Design tokens (from aia-portal tailwind.config) ───────────── */
    :root {
      --primary:       #65A694;
      --primary-dark:  #47766C;
      --primary-light: #CCE0DC;
      --bg:            #F2F7F6;
      --surface:       #FFFFFF;
      --border:        #E6F0EE;
      --text-900:      #0C1312;
      --text-600:      #3D5C57;
      --text-400:      #83B4AA;
      --radius-sm:     6px;
      --radius-md:     8px;
      --radius-lg:     10px;
      --shadow-sm:     0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
      --shadow-md:     0 4px 12px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.04);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text-900);min-height:100vh;display:flex;align-items:center;justify-content:center}

    /* subtle pattern background */
    body::before{
      content:'';position:fixed;inset:0;
      background-image:radial-gradient(circle at 25% 35%,rgba(101,166,148,.12) 0%,transparent 50%),
                       radial-gradient(circle at 75% 70%,rgba(71,118,108,.08) 0%,transparent 50%);
      pointer-events:none;z-index:0;
    }

    .login-wrapper{position:relative;z-index:1;width:100%;max-width:420px;padding:1rem}

    /* logo */
    .brand{display:flex;align-items:center;gap:.625rem;justify-content:center;margin-bottom:2rem}
    .brand-icon{width:40px;height:40px;background:var(--primary);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center}
    .brand-icon svg{color:#fff}
    .brand-name{font-size:1.375rem;font-weight:700;color:var(--text-900);letter-spacing:-.02em}
    .brand-name span{color:var(--primary)}

    .card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:2rem;border:1px solid var(--border)}

    h1{font-size:1.25rem;font-weight:600;margin-bottom:.375rem}
    .subtitle{font-size:.875rem;color:var(--text-600);margin-bottom:1.75rem}

    .form-group{margin-bottom:1.125rem}
    label{display:block;font-size:.8125rem;font-weight:500;color:var(--text-600);margin-bottom:.375rem}
    input{
      display:block;width:100%;padding:.625rem .875rem;
      border:1.5px solid var(--border);border-radius:var(--radius-md);
      font-family:inherit;font-size:.9375rem;color:var(--text-900);
      background:var(--bg);outline:none;transition:border-color .15s,box-shadow .15s;
    }
    input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(101,166,148,.15)}
    input::placeholder{color:var(--text-400)}

    .password-wrap{position:relative}
    .password-wrap input{padding-right:2.75rem}
    .toggle-pass{
      position:absolute;top:50%;right:.75rem;transform:translateY(-50%);
      background:none;border:none;cursor:pointer;color:var(--text-400);padding:.25rem;
      display:flex;align-items:center;
    }
    .toggle-pass:hover{color:var(--primary)}

    .forgot{text-align:right;margin-top:.375rem}
    .forgot a{font-size:.8125rem;color:var(--primary);text-decoration:none;font-weight:500}
    .forgot a:hover{text-decoration:underline}

    .btn-primary{
      display:block;width:100%;padding:.75rem;margin-top:1.5rem;
      background:var(--primary);color:#fff;border:none;border-radius:var(--radius-md);
      font-family:inherit;font-size:.9375rem;font-weight:600;cursor:pointer;
      transition:background .15s,transform .1s;letter-spacing:.01em;
    }
    .btn-primary:hover{background:var(--primary-dark)}
    .btn-primary:active{transform:scale(.99)}

    .divider{display:flex;align-items:center;gap:.75rem;margin:1.5rem 0;color:var(--text-400);font-size:.8125rem}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

    .btn-google{
      display:flex;align-items:center;justify-content:center;gap:.625rem;
      width:100%;padding:.6875rem;border:1.5px solid var(--border);border-radius:var(--radius-md);
      background:var(--surface);font-family:inherit;font-size:.9375rem;font-weight:500;
      color:var(--text-900);cursor:pointer;transition:border-color .15s,background .15s;
    }
    .btn-google:hover{border-color:var(--primary);background:var(--bg)}

    .footer-note{text-align:center;font-size:.8125rem;color:var(--text-600);margin-top:1.5rem}
    .footer-note a{color:var(--primary);font-weight:500;text-decoration:none}
    .footer-note a:hover{text-decoration:underline}

    /* demo helper */
    .demo-bar{
      background:var(--primary-light);border:1px solid var(--primary);
      border-radius:var(--radius-md);padding:.625rem .875rem;
      font-size:.8125rem;color:var(--primary-dark);margin-bottom:1.25rem;
      display:flex;align-items:center;gap:.5rem;
    }
    .demo-bar svg{flex-shrink:0}
  </style>
</head>
<body>
  <div class="login-wrapper">
    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/></svg>
      </div>
      <span class="brand-name">App<span>In</span>App</span>
    </div>

    <div class="card">
      <!-- Demo hint -->
      <div class="demo-bar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 8v4m0 4h.01"/></svg>
        Prototype demo — click <strong>&nbsp;Sign In&nbsp;</strong> to enter the launcher
      </div>

      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to your AppInApp portal</p>

      <div class="form-group">
        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="admin@restaurant.com" value="admin@restaurant.com" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input id="password" type="password" placeholder="Enter password" value="••••••••" />
          <button class="toggle-pass" type="button" aria-label="Toggle password">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          </button>
        </div>
        <div class="forgot"><a href="#">Forgot password?</a></div>
      </div>

      <button class="btn-primary" onclick="window.location.href='launcher.html'">Sign In</button>

      <div class="divider">or continue with</div>

      <button class="btn-google">
        <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Continue with Google
      </button>
    </div>

    <p class="footer-note">Don't have an account? <a href="#">Contact your administrator</a></p>
  </div>
</body>
</html>
