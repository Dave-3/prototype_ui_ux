<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>AppInApp – Layout A · App Navigation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --primary:#65A694;--primary-dark:#47766C;--primary-light:#CCE0DC;
      --bg:#F2F7F6;--surface:#ffffff;--border:#E6F0EE;
      --text-900:#0C1312;--text-600:#3D5C57;--text-400:#83B4AA;
      --sidebar-w:240px;
      --topnav-h:60px;
      --apprail-h:52px;
      --radius-sm:6px;--radius-md:8px;--radius-lg:10px;--radius-xl:14px;
      --shadow-sm:0 1px 3px rgba(0,0,0,.06);
      --shadow-md:0 4px 12px rgba(0,0,0,.08);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text-900);display:flex;flex-direction:column;height:100vh;overflow:hidden}

    /* ════════════════════════════════
       TOP NAV
    ════════════════════════════════ */
    .topnav{
      height:var(--topnav-h);background:var(--surface);
      border-bottom:1px solid var(--border);
      display:flex;align-items:center;justify-content:space-between;
      padding:0 1rem 0 .875rem;z-index:200;flex-shrink:0;
    }
    .topnav-left{display:flex;align-items:center;gap:.75rem}
    .brand{display:flex;align-items:center;gap:.5rem;text-decoration:none;color:inherit;flex-shrink:0}
    .brand-icon{width:32px;height:32px;background:var(--primary);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center}
    .brand-icon svg{color:#fff}
    .brand-name{font-size:1.0625rem;font-weight:700;letter-spacing:-.02em}
    .brand-name span{color:var(--primary)}

    .divider-v{width:1px;height:20px;background:var(--border);flex-shrink:0}

    /* app switcher pills in top nav */
    .app-switcher{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none}
    .app-switcher::-webkit-scrollbar{display:none}
    .app-pill{
      display:flex;align-items:center;gap:.4375rem;padding:.3125rem .75rem;
      border-radius:99px;border:none;background:transparent;
      font-family:'Inter',sans-serif;font-size:.8125rem;font-weight:500;
      color:var(--text-600);cursor:pointer;white-space:nowrap;
      transition:background .15s,color .15s;
    }
    .app-pill:hover{background:var(--bg);color:var(--text-900)}
    .app-pill.active{background:var(--primary-light);color:var(--primary-dark);font-weight:600}
    .app-pill-dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.5}
    .app-pill.active .app-pill-dot{opacity:1}

    /* launcher button */
    .launcher-btn{
      display:flex;align-items:center;gap:.4375rem;padding:.3125rem .75rem;
      border-radius:99px;border:1.5px solid var(--border);background:var(--bg);
      font-family:'Inter',sans-serif;font-size:.8125rem;font-weight:500;
      color:var(--text-600);cursor:pointer;
      transition:border-color .15s,color .15s;white-space:nowrap;
    }
    .launcher-btn:hover{border-color:var(--primary);color:var(--primary)}

    .topnav-right{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
    .icon-btn{width:32px;height:32px;border-radius:var(--radius-md);border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-600);transition:background .15s}
    .icon-btn:hover{background:var(--bg)}
    .badge-wrap{position:relative}
    .badge{position:absolute;top:-2px;right:-2px;width:15px;height:15px;background:#E8503D;border-radius:50%;border:2px solid var(--surface);display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff;font-weight:700}
    .avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:600;cursor:pointer}

    /* layout toggle */
    .layout-toggle{display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:3px;gap:2px}
    .layout-btn{display:flex;align-items:center;gap:.3125rem;padding:.25rem .625rem;border-radius:99px;border:none;background:transparent;font-family:'Inter',sans-serif;font-size:.75rem;font-weight:500;color:var(--text-600);cursor:pointer;transition:background .15s,color .15s}
    .layout-btn.active{background:var(--surface);color:var(--primary-dark);box-shadow:var(--shadow-sm)}

    /* context chip */
    .ctx-chip{display:flex;align-items:center;gap:.375rem;font-size:.75rem;color:var(--text-600);padding:.25rem .5rem;border-radius:var(--radius-md);cursor:pointer;transition:background .15s;background:transparent;border:none;font-family:'Inter',sans-serif}
    .ctx-chip:hover{background:var(--bg)}
    .ctx-dot{width:7px;height:7px;border-radius:50%;background:var(--primary);flex-shrink:0}

    /* ════════════════════════════════
       BODY (sidebar + content)
    ════════════════════════════════ */
    .body-wrap{display:flex;flex:1;overflow:hidden}

    /* ── Sidebar ── */
    .sidebar{
      width:var(--sidebar-w);background:var(--surface);
      border-right:1px solid var(--border);display:flex;flex-direction:column;
      flex-shrink:0;overflow-y:auto;scrollbar-width:thin;
      scrollbar-color:var(--border) transparent;
    }
    .sidebar::-webkit-scrollbar{width:4px}
    .sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}

    .sidebar-header{padding:1rem 1rem .5rem;display:flex;align-items:center;gap:.5rem}
    /* app colour blob */
    .sidebar-app-icon{
      width:30px;height:30px;border-radius:var(--radius-md);
      display:flex;align-items:center;justify-content:center;
      color:#fff;font-size:.625rem;font-weight:700;flex-shrink:0;
    }
    .sidebar-app-name{font-size:.9375rem;font-weight:700;letter-spacing:-.01em}

    .sidebar-section{padding:.5rem 1rem .25rem;font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text-400)}

    .sidebar-divider{height:1px;background:var(--border);margin:.375rem .875rem}

    .nav-item{
      display:flex;align-items:center;gap:.625rem;
      padding:.5rem .875rem;border-radius:var(--radius-md);
      text-decoration:none;color:var(--text-600);font-size:.875rem;font-weight:500;
      cursor:pointer;transition:background .12s,color .12s;
      margin:1px .5rem;
    }
    .nav-item:hover{background:var(--bg);color:var(--text-900)}
    .nav-item.active{background:var(--primary-light);color:var(--primary-dark)}
    .nav-item.active svg{color:var(--primary)}
    .nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.75}
    .nav-item.active svg{opacity:1}
    .nav-badge{margin-left:auto;background:#E8503D;color:#fff;font-size:.6875rem;font-weight:700;padding:.125rem .4375rem;border-radius:99px}
    .nav-badge-ok{margin-left:auto;background:#d1fae5;color:#047857;font-size:.6875rem;font-weight:600;padding:.125rem .4375rem;border-radius:99px}

    /* nested nav */
    .nav-parent{display:flex;align-items:center;gap:.625rem;padding:.5rem .875rem;border-radius:var(--radius-md);text-decoration:none;color:var(--text-600);font-size:.875rem;font-weight:500;cursor:pointer;transition:background .12s,color .12s;margin:1px .5rem;justify-content:space-between}
    .nav-parent:hover{background:var(--bg);color:var(--text-900)}
    .nav-parent-left{display:flex;align-items:center;gap:.625rem}
    .nav-parent svg.icon{width:17px;height:17px;opacity:.75}
    .nav-parent svg.chevron{width:13px;height:13px;transition:transform .2s;opacity:.5}
    .nav-parent.open svg.chevron{transform:rotate(90deg)}
    .nav-children{margin-left:2.375rem;overflow:hidden;max-height:0;transition:max-height .25s ease}
    .nav-children.open{max-height:300px}
    .nav-child{display:flex;align-items:center;gap:.5rem;padding:.375rem .5rem;border-radius:var(--radius-md);text-decoration:none;color:var(--text-600);font-size:.8125rem;cursor:pointer;transition:background .12s,color .12s;margin:1px .25rem}
    .nav-child:hover{background:var(--bg);color:var(--text-900)}
    .nav-child.active{color:var(--primary-dark);font-weight:600}

    /* sidebar footer */
    .sidebar-footer{margin-top:auto;border-top:1px solid var(--border);padding:.75rem}
    .sidebar-footer-item{display:flex;align-items:center;gap:.625rem;padding:.45rem .5rem;border-radius:var(--radius-md);color:var(--text-600);font-size:.8125rem;cursor:pointer;transition:background .12s;text-decoration:none}
    .sidebar-footer-item:hover{background:var(--bg);color:var(--text-900)}
    .sidebar-footer-item svg{width:16px;height:16px;flex-shrink:0}

    /* ── Content area ── */
    .content{flex:1;overflow-y:auto;display:flex;flex-direction:column}

    /* page header */
    .page-header{
      background:var(--surface);border-bottom:1px solid var(--border);
      padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-shrink:0;
    }
    .page-title{font-size:1.125rem;font-weight:700;letter-spacing:-.02em}
    .page-breadcrumb{font-size:.8125rem;color:var(--text-600);display:flex;align-items:center;gap:.375rem;margin-top:.1875rem}
    .bc-sep{opacity:.4}

    .page-actions{display:flex;align-items:center;gap:.5rem}
    .btn{display:flex;align-items:center;gap:.4375rem;padding:.5rem 1rem;border-radius:var(--radius-md);font-family:'Inter',sans-serif;font-size:.875rem;font-weight:500;cursor:pointer;border:none;transition:background .15s}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-primary:hover{background:var(--primary-dark)}
    .btn-secondary{background:var(--bg);color:var(--text-600);border:1.5px solid var(--border)}
    .btn-secondary:hover{border-color:var(--primary);color:var(--primary)}
    .btn svg{width:15px;height:15px}

    /* tab bar */
    .tab-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;align-items:flex-end;gap:0;flex-shrink:0}
    .tab{padding:.6875rem .875rem;font-size:.875rem;font-weight:500;color:var(--text-600);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s}
    .tab:hover{color:var(--text-900)}
    .tab.active{color:var(--primary-dark);border-bottom-color:var(--primary)}
    .tab-count{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;background:var(--primary);color:#fff;border-radius:50%;font-size:.6875rem;font-weight:700;margin-left:.4375rem}

    /* main content padding */
    .content-inner{padding:1.5rem;flex:1}

    /* ── Cards & widgets ── */
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
    .card-header{padding:.875rem 1.125rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .card-title{font-size:.9375rem;font-weight:600}
    .card-body{padding:1.125rem}

    .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:.875rem;margin-bottom:1.25rem}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.125rem}
    .stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem}
    .stat-label{font-size:.75rem;font-weight:500;color:var(--text-600);text-transform:uppercase;letter-spacing:.06em}
    .stat-icon-wrap{width:30px;height:30px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center}
    .stat-icon-wrap svg{width:15px;height:15px}
    .stat-value{font-size:1.4375rem;font-weight:700;letter-spacing:-.03em}
    .stat-sub{font-size:.75rem;color:var(--text-600);margin-top:.25rem}
    .up{color:#10B981}.down{color:#E8503D}

    /* order table */
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:.875rem}
    thead th{text-align:left;padding:.625rem .875rem;font-size:.75rem;font-weight:600;color:var(--text-600);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border)}
    tbody tr{border-bottom:1px solid var(--border);transition:background .1s;cursor:pointer}
    tbody tr:last-child{border-bottom:none}
    tbody tr:hover{background:var(--bg)}
    td{padding:.6875rem .875rem;vertical-align:middle}
    .order-id{font-weight:600;color:var(--primary-dark)}
    .chip{display:inline-flex;align-items:center;padding:.1875rem .5625rem;border-radius:99px;font-size:.75rem;font-weight:600}
    .chip-green{background:#d1fae5;color:#047857}
    .chip-yellow{background:#fef3c7;color:#d97706}
    .chip-blue{background:#dbeafe;color:#1d4ed8}
    .chip-red{background:#fee2e2;color:#b91c1c}
    .chip-gray{background:#f3f4f6;color:#374151}

    /* empty state */
    .empty{text-align:center;padding:3rem 1rem;color:var(--text-600)}
    .empty-icon{width:48px;height:48px;margin:0 auto .875rem;background:var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center}
    .empty-icon svg{color:var(--text-400)}
  </style>
</head>
<body>

<!-- ════════════════════ TOP NAV ════════════════════ -->
<header class="topnav">
  <div class="topnav-left">
    <a href="launcher.html" class="brand">
      <div class="brand-icon">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/></svg>
      </div>
      <span class="brand-name">App<span>In</span>App</span>
    </a>

    <div class="divider-v"></div>

    <!-- App switcher pills -->
    <nav class="app-switcher" id="appSwitcher">
      <button class="app-pill active" data-app="orders" onclick="switchApp('orders')"><span class="app-pill-dot"></span>Orders</button>
      <button class="app-pill" data-app="menu" onclick="switchApp('menu')"><span class="app-pill-dot"></span>Menu</button>
      <button class="app-pill" data-app="reservations" onclick="switchApp('reservations')"><span class="app-pill-dot"></span>Reservations</button>
      <button class="app-pill" data-app="pos" onclick="switchApp('pos')"><span class="app-pill-dot"></span>POS</button>
      <button class="app-pill" data-app="delivery" onclick="switchApp('delivery')"><span class="app-pill-dot"></span>Delivery</button>
      <button class="app-pill" data-app="customers" onclick="switchApp('customers')"><span class="app-pill-dot"></span>Customers</button>
      <button class="app-pill" data-app="staff" onclick="switchApp('staff')"><span class="app-pill-dot"></span>Staff</button>
      <button class="app-pill" data-app="payments" onclick="switchApp('payments')"><span class="app-pill-dot"></span>Payments</button>
    </nav>

    <div class="divider-v"></div>

    <button class="launcher-btn" onclick="window.location.href='launcher.html'">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/></svg>
      All Apps
    </button>
  </div>

  <div class="topnav-right">
    <!-- Context -->
    <button class="ctx-chip" title="Switch branch/vendor">
      <div class="ctx-dot"></div>
      Kilimani Grill · Main Branch
      <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>
    </button>

    <div class="divider-v"></div>

    <!-- Layout toggle -->
    <div class="layout-toggle">
      <button class="layout-btn active" id="btn-launcher" onclick="gotoLayout('launcher')">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/></svg>
        A
      </button>
      <button class="layout-btn" id="btn-classic" onclick="gotoLayout('classic')">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 5.25h16.5M3.75 12h16.5m-16.5 6.75h16.5"/></svg>
        B
      </button>
    </div>

    <div class="divider-v"></div>

    <div class="badge-wrap">
      <button class="icon-btn" title="Notifications">
        <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/></svg>
      </button>
      <div class="badge">3</div>
    </div>
    <div class="avatar" title="Profile">JA</div>
  </div>
</header>

<!-- ════════════════════ BODY ════════════════════ -->
<div class="body-wrap">

  <!-- ── Sidebar (dynamic per app) ── -->
  <aside class="sidebar" id="sidebar">
    <!-- filled by JS -->
  </aside>

  <!-- ── Content ── -->
  <div class="content" id="mainContent">
    <!-- filled by JS -->
  </div>

</div><!-- /body-wrap -->

<script>
/* ═══════════════════════════════════════════════
   App definitions — sidebar nav per app
═══════════════════════════════════════════════ */
const apps = {
  orders: {
    name:'Orders', color:'#65A694', iconBg:'#E6F0EE', iconColor:'#47766C',
    icon:`<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>`,
    nav:[
      {label:'Dashboard', id:'dashboard', icon:'chart', badge:null},
      {label:'Live Orders', id:'live', icon:'bolt', badge:'12'},
      {label:'Order History', id:'history', icon:'clock', badge:null},
      {label:'Temp Orders', id:'temp', icon:'clipboard', badge:null},
      {section:'Fulfilment'},
      {label:'Kitchen Queue', id:'kitchen', icon:'fire', badge:'4'},
      {label:'Delivery Queue', id:'delivery-q', icon:'truck', badge:'6'},
      {label:'Completed', id:'completed', icon:'check-circle', badge:null},
      {section:'Settings'},
      {label:'Order Settings', id:'ord-settings', icon:'cog', badge:null},
    ]
  },
  menu:{
    name:'Menu', color:'#f59e0b', iconBg:'#fef3c7', iconColor:'#d97706',
    icon:`<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/></svg>`,
    nav:[
      {label:'Overview', id:'menu-overview', icon:'chart', badge:null},
      {label:'Products', id:'products', icon:'tag', badge:null,

let currentApp='orders';
let activeNavId='live';

function buildSidebar(appKey){
  const app=apps[appKey];
  if(!app) return;
  const sb=document.getElementById('sidebar');

  let html=`
    <div class="sidebar-header">
      <div class="sidebar-app-icon" style="background:${app.color}">${app.icon}</div>
      <div class="sidebar-app-name">${app.name}</div>
    </div>
    <div class="sidebar-divider"></div>
  `;

  app.nav.forEach(item=>{
    if(item.section){
      html+=`<div class="sidebar-section">${item.section}</div>`;
      return;
    }
    if(item.children){
      const isOpen=item.children.some(c=>c.id===activeNavId);
      html+=`
        <div class="nav-parent ${isOpen?'open':''}" onclick="toggleNav(this)">
          <div class="nav-parent-left">
            ${icon(item.icon)}
            ${item.label}
          </div>
          <svg class="chevron" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
        </div>
        <div class="nav-children ${isOpen?'open':''}">
          ${item.children.map(c=>`
            <div class="nav-child ${c.id===activeNavId?'active':''}" onclick="setActive('${c.id}')">${c.label}</div>
          `).join('')}
        </div>`;
    } else {
      html+=`
        <div class="nav-item ${item.id===activeNavId?'active':''}" onclick="setActive('${item.id}')">
          ${icon(item.icon)}
          ${item.label}
          ${item.badge?`<span class="nav-badge">${item.badge}</span>`:''}

  });

  html+=`

/* ═══════════════════════════════════════════════
   Interactions
═══════════════════════════════════════════════ */
function toggleNav(el){
  el.classList.toggle('open');
  const children=el.nextElementSibling;
  children.classList.toggle('open');
}

function setActive(navId){
  activeNavId=navId;
  buildSidebar(currentApp);
  buildContent(currentApp,navId);
}

function switchApp(appKey){
  currentApp=appKey;
  activeNavId=apps[appKey]?.nav.find(n=>n.id)?.id || 'dashboard';
  // update pills
  document.querySelectorAll('.app-pill').forEach(p=>{
    p.classList.toggle('active',p.dataset.app===appKey);
  });
  buildSidebar(appKey);
  buildContent(appKey,activeNavId);
}

function gotoLayout(mode){
  if(mode==='classic') window.location.href='layout-classic.html';
  if(mode==='launcher') window.location.href='launcher.html';
}

/* Init from sessionStorage or default */
const stored = sessionStorage.getItem('activeApp');
if(stored && apps[stored]) currentApp=stored;
buildSidebar(currentApp);
buildContent(currentApp, activeNavId);
// Activate the right pill
document.querySelectorAll('.app-pill').forEach(p=>{
  p.classList.toggle('active',p.dataset.app===currentApp);
});
</script>
